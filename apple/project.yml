name: Swarm
options:
  bundleIdPrefix: so.swarms
  deploymentTarget:
    iOS: '17.0'
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    DEVELOPMENT_TEAM: A77YW376ZH
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
    SWIFT_EMIT_LOC_STRINGS: YES
    # Native WebKit already respects safe areas; it exposes no JS-to-native bridge.
    ENABLE_HARDENED_RUNTIME: YES
targets:
  Swarm-iOS:
    type: application
    platform: iOS
    sources: [Swarm]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: so.swarms.app
        PRODUCT_NAME: Swarm
        TARGETED_DEVICE_FAMILY: '1,2'
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_FILE: Configuration/iOS-Info.plist
        CODE_SIGN_ENTITLEMENTS: Configuration/iOS.entitlements
    scheme:
      testTargets: [Swarm-iOSTests]
  Swarm-macOS:
    type: application
    platform: macOS
    sources: [Swarm]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: so.swarms.app.macos
        PRODUCT_NAME: Swarm
        INFOPLIST_FILE: Configuration/macOS-Info.plist
        CODE_SIGN_ENTITLEMENTS: Configuration/Swarm.entitlements
    scheme:
      testTargets: [Swarm-macOSTests]
  Swarm-iOSTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SwarmTests, Swarm/ServerAddress.swift, Swarm/SignInAttempt.swift, Swarm/VoiceShortcut.swift, Swarm/VoiceShortcutIntent.swift]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ''
  Swarm-macOSTests:
    type: bundle.unit-test
    platform: macOS
    sources: [SwarmTests, Swarm/ServerAddress.swift, Swarm/SignInAttempt.swift, Swarm/VoiceShortcut.swift]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ''
