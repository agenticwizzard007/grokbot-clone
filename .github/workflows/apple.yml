name: Shared app checks
# Native Mac/iPhone builds are paused. Local scripts and manual Mac releases remain available.
on:
  pull_request:
    paths: ['apple/**', 'web/**', 'server/src/auth/**', 'server/src/accounts.ts', 'server/src/native-auth.ts', 'server/src/routes.ts', 'server/src/lib/auth.ts', 'tests/apple-auth.test.mts', 'tests/native-auth.test.mts', 'tests/composio.test.mts', 'tests/connection-cleanup-ui.mjs', 'tests/mobile-layout.mjs', 'tests/device-access-ui.mjs', 'tests/voice-shortcut.mjs', 'tests/voice-entry-ui.mjs', 'tests/dictation-lifecycle.test.mts', 'package*.json', 'scripts/apple.sh', 'scripts/stage-apple-mac.mjs', 'scripts/package-apple-mac.sh', 'companion/swarm-companion.mjs', 'server/src/computers/**', 'server/src/usage-context.ts', 'server/src/agent/loop.ts', 'server/src/routes-config.ts', 'tests/native-computer.test.mts', 'tests/rename-compat.test.mts', 'tests/latency.test.mts', 'tests/viewer-ready.test.mts', 'companion/tests/**', '.github/workflows/apple.yml']
  push:
    branches: [main]
    paths: ['apple/**', 'web/**', 'server/src/auth/**', 'server/src/accounts.ts', 'server/src/native-auth.ts', 'server/src/routes.ts', 'server/src/lib/auth.ts', 'tests/apple-auth.test.mts', 'tests/native-auth.test.mts', 'tests/composio.test.mts', 'tests/connection-cleanup-ui.mjs', 'tests/mobile-layout.mjs', 'tests/device-access-ui.mjs', 'tests/voice-shortcut.mjs', 'tests/voice-entry-ui.mjs', 'tests/dictation-lifecycle.test.mts', 'package*.json', 'scripts/apple.sh', 'scripts/stage-apple-mac.mjs', 'scripts/package-apple-mac.sh', 'companion/swarm-companion.mjs', 'server/src/computers/**', 'server/src/usage-context.ts', 'server/src/agent/loop.ts', 'server/src/routes-config.ts', 'tests/native-computer.test.mts', 'tests/rename-compat.test.mts', 'tests/latency.test.mts', 'tests/viewer-ready.test.mts', 'companion/tests/**', '.github/workflows/apple.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shared-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm run build
      - run: npm run test:apple-auth && npm run test:native-auth && npm run test:composio
      - name: Test connected-account cleanup
        run: node tests/connection-cleanup-ui.mjs
      - name: Test device access guidance and settings navigation
        run: node tests/device-access-ui.mjs
      - run: npm run test:mobile
      - run: npm run test:voice-shortcut
      - name: Test live voice entry and dictation lifecycle
        run: npm run test:voice-entry
      - name: Test native computer routing, latency and viewer readiness
        run: node --import tsx --test tests/native-computer.test.mts tests/rename-compat.test.mts tests/latency.test.mts tests/viewer-ready.test.mts
      - name: Test native supervisor quick exit regression
        run: python3 apple/MacControl/test_lifecycle.py SupervisorLifecycleTests.test_quick_child_exit_preserves_status
      - name: Install companion desktop test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xdotool imagemagick
      - name: Test companion policies and lifecycle
        run: node --test companion/tests/*.test.mjs
