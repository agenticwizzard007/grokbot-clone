name: Settings disconnect confirmation
permissions:
  contents: read
on:
  pull_request:
    paths: ['web/**', 'server/**', 'tests/settings-disconnect-ui.mjs', 'tests/fixtures/settings-disconnect.server.mts', 'package*.json', '.github/workflows/settings-disconnect.yml']
  push:
    branches: [main]
    paths: ['web/**', 'server/**', 'tests/settings-disconnect-ui.mjs', 'tests/fixtures/settings-disconnect.server.mts', 'package*.json', '.github/workflows/settings-disconnect.yml']
jobs:
  settings-disconnect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tests/settings-disconnect-ui.mjs
