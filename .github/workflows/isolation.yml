name: Tenant isolation
on:
  pull_request:
    paths: ['server/**', 'tests/**', 'infra/tenant-host/**', 'scripts/test-isolation.mjs', 'package*.json', '.github/workflows/isolation.yml']
  push:
    branches: [main]
    paths: ['server/**', 'tests/**', 'infra/tenant-host/**', 'scripts/test-isolation.mjs', 'package*.json', '.github/workflows/isolation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deterministic-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: isolation_test_only
          POSTGRES_DB: isolation_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:isolation_test_only@127.0.0.1:5432/isolation_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm run build
      - run: npm run test:deployment
      - run: npm run test:isolation
      - run: npm run test:cli
      # Real container/Fly/provider qualification has a separate controlled
      # inventory. This job must not claim those external gates passed.
