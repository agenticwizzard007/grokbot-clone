name: Signup settings regression
on:
  pull_request:
    paths: ['web/**', 'server/**', 'tests/platform-signup-*', 'package*.json', '.github/workflows/platform-signup.yml']
  push:
    branches: [main]
    paths: ['web/**', 'server/**', 'tests/platform-signup-*', 'package*.json', '.github/workflows/platform-signup.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signup-settings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --import tsx --test tests/platform-signup-client.test.mts
      - run: npm run build -w web
      - run: node tests/platform-signup-ui.mjs
