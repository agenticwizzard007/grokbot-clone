# Swarm platform role (platform API: provider sign-in, sessions, routing, phone/messaging ownership,
# encrypted events, host backup API). One Fly app per environment; replicas share SESSION_SECRET.
# Deploy:  flyctl deploy -c infra/platform/fly.platform.toml -a <app> --remote-only
# Build:   the repo Dockerfile; SWARM_ROLE selects the process (server/src/index.ts).
app = "swarm-platform-staging"          # production: swarm-platform
primary_region = "iad"

[build]
  dockerfile = "../../Dockerfile"

[env]
  NODE_ENV = "production"
  SWARM_ROLE = "platform"
  PORT = "8787"
  # Owned HTTPS origins. The VM host refuses a non-https exchange endpoint (server/src/runtime/host.ts).
  PLATFORM_URL = "https://platform-staging.example.invalid"          # set to the real owned origin
  COMPOSIO_GATEWAY_URL = "https://gateway-staging.example.invalid"   # set to the gateway's owned origin
  # Backups: S3-compatible bucket (AWS S3, or Tigris on Fly with AWS_ENDPOINT_URL_S3 set as a secret).
  BACKUP_PREFIX = "swarm-backups"
  AWS_REGION = "us-east-1"

# Secrets (flyctl secrets set -a <app> ...), names exactly as read by the code:
#   SESSION_SECRET            >= 32 bytes, identical across platform replicas, never copied to a tenant (platform/auth.ts)
#   DATABASE_URL              Managed Postgres, SESSION pooling or direct (LISTEN/NOTIFY; platform/directory.ts, session-notifications.ts)
#   TENANT_KMS_KEY_ID         AWS KMS key ARN (platform/envelopes.ts) + AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY (short-lived IAM preferred)
#   BACKUP_BUCKET             private, versioned bucket (platform/backup-storage.ts); AWS_ENDPOINT_URL_S3 for Tigris
#   COMPOSIO_API_KEY          platform-owned PROJECT credential (platform/composio-service.ts rejects ck_/uak_ keys)
#   GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET   OIDC web client; callback ${PLATFORM_URL}/api/auth/google/callback
#   APPLE_TEAM_ID APPLE_KEY_ID APPLE_SERVICE_ID APPLE_IOS_CLIENT_ID APPLE_MACOS_CLIENT_ID APPLE_PRIVATE_KEY
#   INKBOX_API_KEY INKBOX_ADMIN_API_KEY INKBOX_IDENTITY_ID INKBOX_SIGNING_KEY INKBOX_HANDLE   (messaging ownership)
#   PLATFORM_PRIVATE_KEY / PLATFORM_PUBLIC_KEY   Ed25519 PKCS8 / SPKI PEM, mounted as files below
# The schema migration is NOT run by this process: see README.md (separate trusted job with MIGRATION_DATABASE_URL).

[[files]]
  guest_path = "/run/swarm/platform-private.pem"
  secret_name = "PLATFORM_PRIVATE_KEY"
[[files]]
  guest_path = "/run/swarm/platform-public.pem"
  secret_name = "PLATFORM_PUBLIC_KEY"
[env.files]
  PLATFORM_PRIVATE_KEY_FILE = "/run/swarm/platform-private.pem"
  PLATFORM_PUBLIC_KEY_FILE = "/run/swarm/platform-public.pem"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 2        # two replicas: SessionNotifications needs one LISTEN connection each
  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"          # 503 until the directory listener is ready (platform/server.ts)

[[vm]]
  size = "performance-2x"         # 2 vCPU / 4 GB: directory pool max 20 per process, relays for ~500 tenants per replica (unmeasured)
  memory = "4gb"
