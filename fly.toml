# Swarm on Fly.io: one always-on machine (routines, check-ins and texts need a running server)
# with a volume for the SQLite database, files and Bot setups.
app = "swarm-team"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8787"
  DB_PATH = "/data/swarm.db"
  FILES_DIR = "/data/files"
  # Every user gets their own cloud VM (created at sign-up), with one screen per Bot. See README → Cloud VMs.
  COMPUTER_PROVIDER = "cloudvm"
  VM_DRIVER = "fly"
  FLY_VM_APP = "swarm-team-vms"
  VM_IMAGE = "registry.fly.io/swarm-team-vms:v1"
  VM_REGION = "iad"
  # Measured: ~325 MB per Bot (screen + Chrome); 2 GB + 384 MB per Bot fits ~4 Bots without a resize.
  VM_BASE_MEMORY_MB = "2048"
  VM_SCREEN_MEMORY_MB = "384"
  VM_PROVISION_EXISTING = "1"
  # Cost: a VM sleeps 5 idle minutes after its last task (waking takes ~2 s), sleeps right after
  # it's set up, uses a 3 GB disk, and is archived after 7 days asleep (VM deleted, disk kept;
  # the next task boots a fresh VM on the same disk in ~25 s).
  SWARM_IDLE_SUSPEND_MIN = "5"
  VM_VOLUME_GB = "3"
  VM_ARCHIVE_AFTER_HOURS = "168"
  DEV_LOGIN = "0"
  # Inkbox posts texts to the public URL (no tunnel needed on a public server).
  INKBOX_TUNNEL = "0"

[[mounts]]
  source = "swarm_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  # Always on: Bots run routines and check-ins on their own schedule.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
