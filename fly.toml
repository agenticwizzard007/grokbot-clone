# Grokbot on Fly.io: one always-on machine (routines, check-ins and texts need a running server)
# with a volume for the SQLite database, files and Bot setups.
app = "grokbot-team"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8787"
  DB_PATH = "/data/grokbot.db"
  FILES_DIR = "/data/files"
  COMPUTER_PROVIDER = "local"
  DEV_LOGIN = "0"
  # Inkbox posts texts to the public URL (no tunnel needed on a public server).
  INKBOX_TUNNEL = "0"

[[mounts]]
  source = "grokbot_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  # Always on: Bots run routines and check-ins on their own schedule.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
